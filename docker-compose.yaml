services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: vacancies
    ports:
      - "27017:27017"   # host:container — change the left side to set host port
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:

