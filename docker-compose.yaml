services:
  job-scraper-celery-beat:
    build:
      context: .
    command: "uv run celery -A src.celery_app beat -l INFO"

    env_file: .env

    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/1

      KAFKA_NOTIFIER_SERVERS: "kafka:29092"

      MONGODB_URL: mongodb://admin:admin@mongodb:27017/vacancies?authSource=admin
      LOG_LEVEL: INFO

    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      kafka_setup:
        condition: service_completed_successfully

    networks:
      - job_scraper_net

  job-scraper-celery:
    build:
      context: .
    command: "uv run celery -A src.celery_app worker -E -l INFO"

    env_file: .env

    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/1

      KAFKA_NOTIFIER_SERVERS: "kafka:29092"

      MONGODB_URL: mongodb://admin:admin@mongodb:27017/vacancies?authSource=admin
      LOG_LEVEL: INFO

    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      kafka_setup:
        condition: service_completed_successfully
    networks:
      - job_scraper_net

  job-scraper-on-start:
    build:
      context: .
    command: "uv run -m src.main"

    env_file: .env

    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_BACKEND_URL: redis://redis:6379/1

      KAFKA_NOTIFIER_SERVERS: "kafka:29092"

      MONGODB_URL: mongodb://admin:admin@mongodb:27017/vacancies?authSource=admin
      LOG_LEVEL: INFO

    depends_on:
      redis:
        condition: service_started
      mongodb:
        condition: service_started
      kafka_setup:
        condition: service_completed_successfully

    networks:
      - job_scraper_net
  
  kafka_setup:
    build:
      context: ./kafka_setup/

    environment:
      KAFKA_SERVERS: "kafka:9092"

    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - job_scraper_net

  mongodb:
    image: "mongo:${MONGO_VERSION:-latest}"
    container_name: mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
      MONGO_INITDB_DATABASE: vacancies
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    
    networks:
      - job_scraper_net

  kafka:
    image: apache/kafka:4.1.0

    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://127.0.0.1:9092,CONTROLLER://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

    ports:
      - "9092:9092"

    healthcheck:
      test: nc -z kafka 9092 || exit -1
      start_period: 15s
      interval: 5s
      timeout: 10s
      retries: 10

    networks:
      - job_scraper_net
    

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    networks:
        - job_scraper_net

volumes:
  mongo_data:

  redis_data:

networks:
  job_scraper_net:
    driver: bridge
